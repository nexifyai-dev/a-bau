<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" fill="none" role="img" aria-label="A-Bau Meisterbetrieb">
  <!-- Dachform-Symbol: stilisiertes Giebeldach als Wordmark-Ikone -->
  <g>
    <!-- Dach-Dreieck -->
    <polygon points="24,8 44,28 4,28" fill="#A4501F"/>
    <!-- Mauerwerk-Rechteck darunter -->
    <rect x="8" y="28" width="32" height="20" rx="2" fill="#A4501F"/>
    <!-- Türöffnung -->
    <rect x="18" y="36" width="12" height="12" rx="1" fill="#FAF8F5"/>
  </g>
  <!-- Wortmarke -->
  <text x="54" y="30" font-family="Outfit, system-ui, sans-serif" font-size="22" font-weight="800" fill="#201D19" letter-spacing="-0.5">A-Bau</text>
  <!-- Subline -->
  <text x="55" y="44" font-family="Outfit, system-ui, sans-serif" font-size="9" font-weight="700" fill="#A4501F" letter-spacing="1.5">MEISTERBETRIEB</text>
</svg>
