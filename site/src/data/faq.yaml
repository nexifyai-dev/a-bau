# FAQ A-Bau — 15 Fragen (DIN-5008, deutsch, keine Preise)
# Hinweis: Preise grundsätzlich nicht hier — Angebot nach Besichtigung.

faq:
  - frage: "Welche Leistungen bietet die A-Bau Meisterbetrieb GmbH an?"
    antwort: "Unser Betrieb deckt ein breites Spektrum ab: Restaurierung denkmalgeschützter Bauten, Innenausbau, Krankenhausbau, Schlüsselfertigbau und Neubau, Installationen für Strom und Wasser, Sanierung und Altbau-Restauration sowie europaweite Direkttransporte mit dem eigenen Sprinter. Im Register eingetragen sind unter anderem auch Trockenbau, Estrich- und Bodenarbeiten, Steinmetz- und Mauerarbeiten sowie Garten- und Landschaftsbau."
  - frage: "In welcher Region arbeitet A-Bau?"
    antwort: "Unser Einsatzgebiet ist Mönchengladbach und ganz Nordrhein-Westfalen – insbesondere Geistenbeck, Viersen, Krefeld, Düsseldorf und Köln. Transportleistungen führen wir europaweit aus."
  - frage: "Ist A-Bau ein Meisterbetrieb?"
    antwort: "Ja, die Firma trägt den Zusatz Meisterbetrieb im Namen. Die zuständige Handwerkskammer und der Meisterbrief-Nachweis werden im Impressum ergänzt, sobald uns die Angaben vom Kunden bestätigt wurden."
  - frage: "Wie lange gibt es das Unternehmen schon?"
    antwort: "Die A-Bau Meisterbetrieb GmbH ist seit 2019 im Handelsregister des Amtsgerichts Mönchengladbach eingetragen (HRB 18836). Geschäftsführer ist Albert Pfeiffer. Details zur Firmengeschichte ergänzen wir nach Kundenangabe."
  - frage: "Was kostet eine Restaurierung oder ein Bauprojekt?"
    antwort: "Baukosten hängen von Umfang, Zustand und Material ab – pauschale Preisangaben wären irreführend. Vereinbaren Sie einen unverbindlichen Termin: Nach Besichtigung erhalten Sie ein transparentes Angebot mit Leistungsbeschreibung."
  - frage: "Übernimmt A-Bau auch denkmalgeschützte Objekte?"
    antwort: "Ja, die Restaurierung denkmalgeschützter Bauten ist unsere Kernkompetenz. Wir arbeiten mit Denkmalbehörden zusammen und erhalten bei der Restaurierung die Originalsubstanz, soweit es die Statik erlaubt."
  - frage: "Baut A-Bau auch schlüsselfertig?"
    antwort: "Ja. Schlüsselfertigbau und Neubau gehören zu unseren Leistungen – von Rohbau über Ausbau bis zur Übergabe, mit transparenter Leistungsbeschreibung und festen Terminen."
  - frage: "Kann A-Bau in Krankenhäusern und Pflegeeinrichtungen arbeiten?"
    antwort: "Ja, wir realisieren komplexe Gesundheitsbauten schlüsselfertig, auch Sanierungen unter laufendem Betrieb. Hygienekonforme Ausführung und Termintreue sind dabei Standard."
  - frage: "Führt A-Bau auch Elektro- und Sanitärarbeiten aus?"
    antwort: "Ja, Installationen für Strom und Wasser sind im Register-Gegenstand des Betriebs eingetragen. Wir führen Elektro-, Sanitär- und Heizungsinstallationen normgerecht aus und dokumentieren die Arbeiten."
  - frage: "Wie läuft ein Projekt ab?"
    antwort: "Der Ablauf ist klar strukturiert: 1. Kontakt und unverbindliche Besichtigung, 2. Angebot mit Leistungsbeschreibung, 3. Auftrag und Terminplan, 4. Ausführung mit fester Ansprechperson, 5. Übergabe und Gewährleistung. Bei größeren Vorhaben erhalten Sie eine laufende Projektdokumentation."
  - frage: "Gibt es eine Gewährleistung?"
    antwort: "Ja. Bauleistungen unterliegen den gesetzlichen Gewährleistungsregelungen. Nach Übergabe betreuen wir Projekte weiter und regeln Beanstandungen zuverlässig."
  - frage: "Kann A-Bau auch Transporte für meine Baustelle übernehmen?"
    antwort: "Ja, mit dem firmeneigenen Sprinter transportieren wir Material und Ausstattung direkt zur Baustelle – deutschlandweit und europaweit. Das reduziert Abhängigkeiten von externen Spediteuren."
  - frage: "Wird auch saniert, wenn das Gebäude bewohnt oder genutzt wird?"
    antwort: "Ja, Sanierungen im Bestand führen wir nach Absprache auch bei laufendem Betrieb durch. Wir planen die Bauabschnitte so, dass Beeinträchtigungen minimal bleiben."
  - frage: "Wie erreiche ich die A-Bau Meisterbetrieb GmbH?"
    antwort: "Per Telefon unter (02166) 9925056 oder 0162 18 15 229, per E-Mail an kontakt@a-bau.info oder über das Kontaktformular auf dieser Website. Unsere Öffnungszeiten: Mo–Do 08:00–17:00 Uhr, Fr 07:00–17:00 Uhr, Sa 08:00–13:00 Uhr."
  - frage: "Wie kann ich einen Termin vereinbaren?"
    antwort: "Nutzen Sie das Kontaktformular, rufen Sie uns an oder schreiben Sie an kontakt@a-bau.info. Nennen Sie uns kurz Ihr Vorhaben – wir melden uns zeitnah für einen unverbindlichen Termin."
