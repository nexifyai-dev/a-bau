# FAQ — 14 Fragen (SEO + Chatbot-Wissen)
faq:
  - f: "Welche Leistungen bietet A-Bau Meisterbetrieb an?"
    a: "Wir realisieren Restaurierung denkmalgeschützter Bauten, Innenausbauten, Krankenhaus- und Gesundheitsbau, Schlüsselfertigbau, Sanierung von Altbauten, Installationen (Strom & Wasser) sowie europaweite Transporte mit unserem eigenen Sprinter. Details finden Sie auf der Seite Leistungen."
  - f: "In welcher Region arbeitet A-Bau?"
    a: "Unser Firmensitz ist Mönchengladbach (Luisental 69, 41199 Mönchengladbach-Geistenbeck). Wir arbeiten schwerpunktmäßig in Mönchengladbach und NRW – Transporte und Sonderprojekte realisieren wir europaweit."
  - f: "Ist A-Bau auf Denkmalschutz spezialisiert?"
    a: "Ja. Die Erhaltung und Restaurierung historischer Bauwerke ist unsere Priorität. Wir arbeiten substanzschonend, dokumentiert und in Abstimmung mit den Vorgaben des Denkmalschutzes."
  - f: "Wie erhalte ich ein Angebot?"
    a: "Am schnellsten über das Kontaktformular oder telefonisch unter +49 2166 9925056. Beschreiben Sie kurz Ihr Vorhaben – wir melden uns zeitnah mit einer Einschätzung und einem transparenten Angebot."
  - f: "Übernimmt A-Bau auch schlüsselfertige Neubauten?"
    a: "Ja. Schlüsselfertigbau gehört zu unseren Kernleistungen: Wir koordinieren alle Gewerke und übergeben das Gebäude bezugsfertig – vom Rohbau bis zur Übergabe."
  - f: "Was kostet eine Sanierung oder ein Umbau?"
    a: "Das hängt von Umfang, Zustand und Anforderungen ab. Nach einer kurzen Besichtigung oder aussagekräftigen Unterlagen erstellen wir ein transparentes, verbindliches Angebot – ohne versteckte Kosten."
  - f: "Bietet A-Bau auch Elektro- und Wasserinstallationen an?"
    a: "Ja. Strom- und Wasserinstallationen gehören zu unserem Leistungsspektrum – von der Rohmontage bis zur fertigen Anlage, inklusive Heizungsinstallation und Kabelverlegung im Hochbau."
  - f: "Wie sind die Öffnungszeiten?"
    a: "Montag bis Donnerstag 08:00–17:00 Uhr, Freitag 07:00–17:00 Uhr, Samstag 08:00–13:00 Uhr. Außerhalb der Zeiten erreichen Sie uns gern per Kontaktformular oder E-Mail."
  - f: "Ist A-Bau im Handelsregister eingetragen?"
    a: "Ja. A-Bau Meisterbetrieb GmbH, Amtsgericht Mönchengladbach, HRB 18836. Geschäftsführer ist Albert Pfeiffer. Details finden Sie im Impressum."
  - f: "Arbeitet A-Bau auch in Krankenhäusern und Gesundheitseinrichtungen?"
    a: "Ja. Krankenhausbau ist eine Spezialdisziplin von uns: komplexe Gesundheitsbauten mit höchster Präzision – von der Planung bis zur schlüsselfertigen Übergabe, auch im laufenden Betrieb."
  - f: "Kann A-Bau Materialien und Bauteile transportieren?"
    a: "Ja, europaweit. Mit unserem firmeneigenen Sprinter transportieren wir Materialien, Werkzeuge und Bauteile flexibel und direkt zur Baustelle."
  - f: "Wie lange dauert ein typisches Projekt?"
    a: "Das ist projektabhängig. Nach der Besichtigung erhalten Sie einen realistischen Zeitplan mit Meilensteinen – wir kommunizieren transparent und halten Termine ein."
  - f: "Gibt es eine Gewährleistung auf die Bauleistungen?"
    a: "Ja. Bauleistungen unterliegen den gesetzlichen Gewährleistungsregelungen; darüber hinaus vereinbaren wir im Angebot individuelle Zusagen. Qualität und Verlässlichkeit sind unser Anspruch."
  - f: "Warum sollte ich A-Bau beauftragen?"
    a: "Weil wir Handwerk mit Verantwortung verbinden: Erfahrung im Denkmal- und Gesundheitsbau, ein eingetragenes Unternehmen (HRB 18836), transparente Kommunikation und persönliche Betreuung – vom ersten Gespräch bis zur Übergabe."
