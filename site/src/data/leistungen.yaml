# Leistungen A-Bau — Langtexte (DIN-5008-konform, deutsch, keine KI-Floskeln)
# Grundlage: Alt-Site + Register-Gegenstand (NorthData E3) + Recherche
# Hinweise: echte Referenzdaten pro Leistung liefert der Kunde (P0).

leistungen:
  - slug: denkmalrestaurierung
    titel: Denkmalrestaurierung
    subtitel: Historische Bausubstanz fachgerecht erhalten
    hero: "Restaurierung denkmalgeschützter Bauten ist unsere Kernkompetenz – mit Erfahrung, handwerklichem Feingefühl und Respekt vor der Bausubstanz."
    beschreibung: |
      Denkmalgeschützte Gebäude stellen besondere Anforderungen: Originale Substanz bewahren,
      historische Techniken beherrschen und zugleich moderne Standards erfüllen. Wir restaurieren
      Fassaden, Innenräume und Tragwerke in enger Abstimmung mit Denkmalbehörden.
    punkte:
      - Fassadenrestaurierung und Putzinstandsetzung
      - Restaurierung historischer Innenräume (Stuck, Decken, Böden)
      - Statische Ertüchtigung bei Erhalt der Originalsubstanz
      - Abstimmung mit Denkmalbehörden und Genehmigungsprozessen
      - Steinmetz- und Steinbildhauerarbeiten
    cta: "Projekt besprechen – unverbindlich"
    icon: landmark

  - slug: innenausbau
    titel: Innenausbau
    subtitel: Wohnhaus, Gewerbe und Büro – hochwertig ausgeführt
    hero: "Vom Rohbau zum fertigen Raum: Wir gestalten Innenräume, die funktionieren und bleiben."
    beschreibung: |
      Ob privater Wohnausbau, Gewerbefläche oder Büro: Wir übernehmen den Innenausbau
      komplett – von Trockenbau und Bodenarbeiten bis zur finalen Oberfläche. Dabei
      koordinieren wir alle Gewerke aus einer Hand.
    punkte:
      - Trockenbau, Akustikbau und Einbauten
      - Fliesen, Platten, Mosaik und Estrich
      - Bodenbeläge und Raumausstattung
      - Innenausbau nach Maß, auch barrierefrei
      - Gewerke-Koordination aus einer Hand
    cta: "Innenausbau anfragen"
    icon: layout

  - slug: krankenhausbau
    titel: Krankenhausbau
    subtitel: Komplexe Gesundheitsbauten, schlüsselfertig
    hero: "Gesundheitsbauten verlangen Präzision, Hygiene und Termintreue – das ist unser täglicher Standard."
    beschreibung: |
      Krankenhäuser und Pflegeeinrichtungen stellen höchste Anforderungen an Bauqualität,
      Hygiene und Bauablauf. Wir realisieren komplexe Gesundheitsbauten schlüsselfertig –
      auch bei laufendem Betrieb.
    punkte:
      - Schlüsselfertiger Neubau und Umbau von Klinikbereichen
      - Sanierung unter laufendem Betrieb (Bereichslogistik)
      - Hygienekonforme Ausführung nach Fachplanung
      - Installationen Strom und Wasser nach Klinikstandard
      - Termintreue Umsetzung mit Qualitätsdokumentation
    cta: "Krankenhausprojekt anfragen"
    icon: hospital

  - slug: schluesselfertigbau
    titel: Schlüsselfertigbau & Neubau
    subtitel: Effizient geplant, sauber gebaut, fertig übergeben
    hero: "Ein Ansprechpartner, ein Terminplan, ein Ergebnis: Ihr Neubau schlüsselfertig aus einer Hand."
    beschreibung: |
      Vom Fundament bis zur Übergabe: Wir bauen Wohn- und Gewerbegebäude schlüsselfertig.
      Klare Absprachen, feste Termine und ein koordiniertes Gewerketeam sorgen für einen
      reibungslosen Bauablauf.
    punkte:
      - Neubau von Wohn- und Gewerbegebäuden
      - Rohbau über Ausbau bis zur Übergabe
      - Festpreisangebote mit transparenter Leistungsbeschreibung
      - Termintreue Bauleitung und Dokumentation
      - Gewährleistungsmanagement nach Übergabe
    cta: "Neubau planen"
    icon: building

  - slug: installationen
    titel: Installationen Strom & Wasser
    subtitel: Elektro- und Sanitärinstallationen fachgerecht
    hero: "Strom und Wasser: die Lebensadern jedes Gebäudes – sicher geplant, sauber installiert."
    beschreibung: |
      Elektro- und Sanitärinstallationen gehören zum Register-Gegenstand unseres Betriebs.
      Wir führen Installationen in Neubau und Bestand aus – normgerecht, dokumentiert
      und abnahmefähig.
    punkte:
      - Elektroinstallation (Verteiler, Leitungen, Schalter, Licht)
      - Sanitärinstallation (Ver- und Entsorgung, Armaturen)
      - Heizungsinstallation und Anschlussarbeiten
      - Modernisierung und Erweiterung im Bestand
      - Prüfung und Dokumentation der Arbeiten
    cta: "Installation anfragen"
    icon: zap

  - slug: sanierung
    titel: Sanierung & Altbau-Restauration
    subtitel: Technisch, funktional, optisch – Bestand mit Zukunft
    hero: "Alte Gebäude verdienen neue Substanz: Wir sanieren technisch, funktional und optisch."
    beschreibung: |
      Altbauten sanieren heißt: Bestand verstehen und gezielt erneuern. Wir beseitigen
      Schäden, modernisieren Technik und werten Räume optisch auf – bei laufendem
      Wohn- oder Geschäftsbetrieb nach Absprache.
    punkte:
      - Technische Sanierung (Statik, Feuchte, Haustechnik)
      - Funktionale Umbauten und Grundriss-Anpassungen
      - Optische Restauration (Putze, Fassaden, Innenflächen)
      - Schadstoffsanierung nach Fachplanung
      - Modernisierung mit Fördermittel-Begleitung (Empfehlung)
    cta: "Sanierung besprechen"
    icon: wrench

  - slug: transporte
    titel: Europaweite Direkttransporte
    subtitel: Baustellen-Logistik mit eigenem Sprinter
    hero: "Material, Maschinen, Mannschaft: Unser eigener Sprinter bringt alles pünktlich zur Baustelle – europaweit."
    beschreibung: |
      Für unsere Projekte setzen wir auf eigene Logistik: Mit dem firmeneigenen Sprinter
      transportieren wir Material und Ausstattung direkt zur Baustelle – auch über
      Ländergrenzen hinweg. Das spart Zeit, Kosten und Abhängigkeiten.
    punkte:
      - Direkttransporte europaweit
      - Material- und Maschinentransport
      - Termingerechte Anlieferung auf die Baustelle
      - Flexible Disposition für Projekttermine
    cta: "Transport anfragen"
    icon: truck
