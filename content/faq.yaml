  a: Wir beraten, kalkulieren und koordinieren; die Genehmigungsplanung erfolgt in Zusammenarbeit mit Fachplanern.
- f: Was kostet ein schlüsselfertiges Haus?
  a: Die Kosten hängen von Größe, Grundstück, Ausstattung und regionalen Faktoren ab. Ein transparentes, verbindliches Angebot erstellen wir nach der Besichtigung bzw. anhand Ihrer Unterlagen.
- f: Kann A-Bau auch Anbauten und Aufstockungen bauen?
  a: Ja, wir bauen Anbauten und Aufstockungen im Bestand – inklusive Statik, Rohbau, Ausbau und Anschluss an die bestehende Substanz.
