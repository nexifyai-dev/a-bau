- f: Ist A-Bau auf Denkmalschutz spezialisiert?
  a: Ja. Die Erhaltung und Restaurierung historischer Bauwerke ist unsere Priorität. Wir arbeiten substanzschonend, dokumentiert und in Abstimmung mit den Vorgaben des Denkmalschutzes.
