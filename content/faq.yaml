  a: Ja, wir realisieren Gewerbe- und Industriebauten – von der Halle bis zum Bürogebäude, schlüsselfertig aus einer Hand.
- f: Was zeichnet den Krankenhausbau bei A-Bau aus?
  a: 'Komplexe Gesundheitsbauten mit höchster Präzision: Planung, Koordination aller Gewerke und schlüsselfertige Übergabe – auch bei laufendem Betrieb.'
- f: Baut A-Bau auch im laufenden Klinikbetrieb?
  a: Ja, wir führen Maßnahmen in Gesundheitseinrichtungen so aus, dass der Betrieb möglichst wenig gestört wird – mit Rücksicht auf Hygiene- und Sicherheitsvorgaben.
- f: Welche Arbeiten führt A-Bau in Krankenhäusern aus?
  a: Umbauten, Sanierungen, Innenausbau, Installationen und Neubau von Stationen, Funktionsbereichen und Technikflächen.
- f: Werden bei A-Bau Hygieneauflagen im Krankenhausbau eingehalten?
  a: Ja, Hygiene- und Sicherheitsvorgaben von Gesundheitseinrichtungen sind fester Bestandteil unserer Arbeitsplanung.
- f: Kann A-Bau auch Arztpraxen und Pflegeeinrichtungen bauen?
  a: Ja, Praxis- und Pflegeeinrichtungen bauen und sanieren wir mit denselben Standards wie den Krankenhausbau.
- f: Welche Installationen führt A-Bau aus?
  a: Strom- und Wasserinstallationen, Heizungsinstallation sowie Kabelverlegung – von der Rohmontage bis zur fertigen Anlage.
- f: Macht A-Bau auch Elektroinstallationen?
  a: Ja, Elektroinstallationen gehören zu unserem Leistungsspektrum – von der Rohmontage bis zur fertigen, geprüften Anlage.
- f: Werden auch Sanitärinstallationen erneuert?
  a: Ja, wir erneuern Sanitärinstallationen – Leitungen, Anschlüsse und Armaturen.
- f: Übernimmt A-Bau auch Heizungsinstallationen?
  a: Ja, Heizungsinstallation inklusive Heizkörper, Fußbodenheizung und Anschluss an die Wärmequelle.
- f: Wird die Kabelverlegung im Hochbau übernommen?
  a: Ja, Kabelverlegung im Hochbau gehört zu unseren Installationsarbeiten.
- f: Können Installationen auch nachträglich erneuert werden?
  a: Ja, wir erneuern Leitungen und Anschlüsse auch im Bestand – z. B. bei Altbausanierung oder Badmodernisierung.
- f: Bietet A-Bau Transporte an?
  a: Ja, europaweite Direkttransporte mit unserem firmeneigenen Sprinter – für Materialien, Werkzeuge und Bauteile.
