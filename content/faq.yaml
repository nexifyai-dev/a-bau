- f: Was bedeutet Denkmal-Restaurierung?
  a: Denkmal-Restaurierung bedeutet die fachgerechte Erhaltung und Wiederherstellung denkmalgeschützter Bausubstanz – substanzschonend, dokumentiert und in Abstimmung mit den Vorgaben der Denkmalbehörden.
- f: Welche Arbeiten gehören zur Denkmal-Restaurierung?
  a: Typische Arbeiten sind Fassadenrestaurierung, Steinrestaurierung, Fugenarbeiten, Putz- und Stuckarbeiten, Fenster- und Türsanierung, Innenrestaurierung sowie die Sanierung historischer Dächer und Gewölbe.
- f: Brauche ich eine Genehmigung für Arbeiten am denkmalgeschützten Gebäude?
  a: Ja, bei denkmalgeschützten Gebäuden sind Arbeiten in der Regel genehmigungspflichtig. A-Bau berät Sie und stimmt die Maßnahmen frühzeitig mit der zuständigen Denkmalbehörde ab.
- f: Was ist der Unterschied zwischen Denkmal-Restaurierung und normaler Sanierung?
  a: Bei der Denkmal-Restaurierung stehen Erhalt und Wiederherstellung der historischen Substanz im Vordergrund – mit behördlichen Auflagen und dokumentierter Arbeitsweise. Die Sanierung modernisiert dagegen Bestandsgebäude ohne Denkmalschutzauflagen.
- f: Kann A-Bau bei Fördermitteln für Denkmalpflege helfen?
  a: A-Bau informiert über förderfähige Maßnahmen und erstellt die dafür nötigen Angebote und Dokumentationen. Die Fördermittelentscheidung trifft die zuständige Stelle – wir begleiten das Verfahren mit den erforderlichen Unterlagen.
- f: Wie arbeitet A-Bau an historischen Fassaden?
  a: 'Substanzschonend: Bestandsaufnahme, Materialanalyse, schonende Reinigung, fachgerechte Reparatur mit historisch passenden Materialien und abschließende Dokumentation.'
- f: Werden bei der Restaurierung historische Materialien verwendet?
  a: Wir verwenden materialgerechte, für die Bausubstanz geeignete Materialien – nach Möglichkeit historisch passende Kalk-, Lehm- oder Natursteinprodukte.
- f: Wie lange dauert eine Fassadenrestaurierung?
  a: Das hängt von Größe, Zustand und Auflagen ab. Nach der Besichtigung erhalten Sie einen realistischen Zeitplan mit Meilensteinen.
- f: Dokumentiert A-Bau Restaurierungsarbeiten?
  a: Ja. Bei Denkmal- und Restaurierungsprojekten dokumentieren wir die Maßnahmen sorgfältig – das ist Voraussetzung für viele Behörden und Fördermittelgeber.
- f: Übernimmt A-Bau auch die Abstimmung mit dem Denkmalschutz?
  a: 'Ja, das gehört zu unserem Service: Wir stimmen Maßnahmen und Dokumentation frühzeitig mit den zuständigen Behörden ab.'
- f: Was kostet eine Denkmal-Restaurierung?
  a: Die Kosten hängen stark von Objekt, Zustand, Auflagen und Umfang ab. Nach Besichtigung oder aussagekräftigen Unterlagen erstellen wir ein transparentes, verbindliches Angebot.
- f: Kann auch nur ein Teilbereich (z. B. ein Fenster) restauriert werden?
  a: Ja, wir übernehmen auch Teilmaßnahmen wie einzelne Fenster, Türen, Fassadenabschnitte oder Gewölbe – angepasst an Ihre Prioritäten.
- f: Ist A-Bau auf Kirchen oder öffentliche Gebäude spezialisiert?
  a: A-Bau restauriert denkmalgeschützte Bauten verschiedener Art – von Wohngebäuden über Gewerbeobjekte bis zu öffentlichen Gebäuden. Konkrete Referenzprojekte nennen wir auf Anfrage.
- f: Welche Leistungen bietet A-Bau im Überblick?
  a: Denkmal-Restaurierung, Innenausbau, Krankenhaus- und Gesundheitsbau, Schlüsselfertigbau, Sanierung von Altbauten, Installationen (Strom & Wasser) sowie europaweite Transporte mit eigenem Sprinter.
- f: Kann A-Bau ein komplettes Projekt aus einer Hand übernehmen?
  a: Ja. Vom Rohbau über Ausbau, Installationen und Innenausbau bis zur Übergabe – wir koordinieren alle Gewerke und arbeiten mit geprüften Partnern.
- f: Übernimmt A-Bau auch kleine Aufträge?
  a: Ja, auch kleinere Aufträge wie Einzelreparaturen, Teilmodernisierungen oder Restaurierungsmaßnahmen übernehmen wir gern.
- f: Plant A-Bau das Projekt mit oder reicht die Ausführung?
  a: 'Beides: Wir beraten, planen und kalkulieren das Projekt und führen es anschließend mit eigenen Gewerken und Partnern aus.'
- f: Wie läuft ein Bauprojekt mit A-Bau ab?
  a: 1) Beratung und Besichtigung, 2) transparentes Angebot mit festen Preisen, 3) Ausführung durch eigene Gewerke und geprüfte Partner, 4) saubere Übergabe mit Dokumentation und Gewährleistung.
- f: Bekomme ich einen festen Ansprechpartner?
  a: Ja, Sie haben während des gesamten Projekts einen festen Ansprechpartner – vom ersten Gespräch bis zur Übergabe.
- f: Wie wird die Baustelle organisiert?
  a: Wir koordinieren Gewerke, Material und Termine zentral. Bei größeren Vorhaben erhalten Sie eine laufende Projektdokumentation.
- f: Ist eine Baustellenbesichtigung möglich?
  a: Ja, nach Absprache besichtigen wir gerne gemeinsam mit Ihnen die Baustelle oder Ihr Objekt.
- f: Wie kommuniziert A-Bau während des Projekts?
  a: Persönlich, telefonisch und per E-Mail – mit klaren Meilensteinen und offener Kommunikation bei allen Schritten.
- f: Was ist der Unterschied zwischen Sanierung und Renovierung?
  a: Sanierung erhält oder stellt die Substanz eines Gebäudes wieder her (z. B. Statik, Feuchtigkeit, Dach, Leitungen). Renovierung ist die optische Auffrischung wie Streichen oder neuer Bodenbelag.
- f: Wann sollte ich eine Altbausanierung machen lassen?
  a: 'Typische Anzeichen: Feuchtigkeit, Risse, veraltete Leitungen, schlechte Dämmung oder ein sanierungsbedürftiges Dach. Wir prüfen den Zustand bei einer Besichtigung und empfehlen ehrlich.'
- f: Was kostet eine Altbausanierung?
  a: Die Kosten hängen von Umfang, Zustand und Anforderungen ab. Nach Besichtigung oder aussagekräftigen Unterlagen erhalten Sie ein transparentes, verbindliches Angebot – ohne versteckte Kosten.
- f: Wie lange dauert eine Wohnungssanierung?
  a: Je nach Umfang von wenigen Wochen bis mehrere Monate. Den realistischen Zeitplan erhalten Sie mit dem Angebot.
- f: Kann ich während der Sanierung in der Wohnung bleiben?
  a: Das hängt vom Umfang ab. Bei Teilmaßnahmen oft möglich – bei umfassenden Sanierungen empfehlen wir, das Vorgehen gemeinsam zu planen. Wir beraten Sie ehrlich.
- f: Übernimmt A-Bau auch die Sanierung von Feuchtigkeit und Schimmel?
  a: Ja, wir ermitteln die Ursachen (z. B. undichte Leitungen, fehlende Abdichtung) und sanieren fachgerecht – inklusive Trockenlegung und Abdichtung.
- f: Wird auch der Keller saniert?
  a: 'Ja, wir sanieren Keller: Abdichtung, Entwässerung, Trockenlegung und Innenausbau.'
- f: Sanieren Sie auch Badezimmer?
  a: 'Ja, komplette Badmodernisierung: Rückbau, Fliesen, Installationen (Strom & Wasser), Sanitär und Oberflächen.'
- f: Was kostet eine Badsanierung?
  a: Das hängt von Größe, Ausstattung und Zustand ab. Ein transparentes Angebot erhalten Sie nach Besichtigung oder anhand aussagekräftiger Unterlagen.
- f: Wie lange dauert eine Badsanierung?
  a: In der Regel einige Wochen inklusive Trocknungszeiten. Den konkreten Zeitplan erhalten Sie mit dem Angebot.
- f: Übernimmt A-Bau auch Dachsanierung?
  a: 'Ja, wir sanieren Dächer: Abdichtung, Dämmung, Deckung und Dachausbau – auch bei historischer Bausubstanz in Abstimmung mit dem Denkmalschutz.'
- f: Wird auch die Fassade saniert?
  a: 'Ja, Fassadensanierung: Reinigung, Putzarbeiten, Dämmung, Anstrich und die Reparatur von Rissen.'
- f: Macht A-Bau auch energetische Sanierung?
  a: 'Ja, wir führen energetische Maßnahmen aus: Dämmung, Fenstertausch, Heizungserneuerung und die Koordination mit Fördermittelstellen.'
- f: Kann ich Fördermittel für die energetische Sanierung bekommen?
  a: Für viele energetische Maßnahmen gibt es Förderprogramme (z. B. KfW, BAFA). Wir informieren über förderfähige Maßnahmen und unterstützen mit den nötigen Unterlagen – die Entscheidung trifft die Fördermittelstelle.
- f: Wird auch die Heizung erneuert?
  a: Ja, wir erneuern Heizungsanlagen und führen Installationen für Strom, Wasser und Heizung aus – von der Rohmontage bis zur fertigen Anlage.
- f: Übernimmt A-Bau den Fenster- und Türentausch?
  a: Ja, wir tauschen Fenster und Türen – inklusive fachgerechtem Einbau, Abdichtung und, bei Denkmalschutz, in Abstimmung mit den Auflagen.
- f: Was gehört zum Innenausbau?
  a: 'Wände, Decken, Böden, Türen, Treppen, Einbauten und Installationen – kurz: alles, was ein Gebäude innen fertig und nutzbar macht.'
- f: Kann A-Bau auch Wohnungen komplett ausbauen?
  a: 'Ja, vom Rohbau zur bezugsfertigen Wohnung: Trockenbau, Elektrik, Sanitär, Böden, Malerarbeiten und Endmontage.'
- f: Übernimmt A-Bau auch Büro- und Gewerbeausbau?
  a: Ja, wir gestalten Büros, Praxen, Läden und Gewerbeflächen – von der Planung über den Trockenbau bis zur Übergabe.
- f: Was kostet ein Innenausbau pro Quadratmeter?
  a: Das ist stark von Ausstattung und Zustand abhängig. Ein verbindliches Angebot erhalten Sie nach Besichtigung – pauschale Quadratmeterpreise nennen wir bewusst nicht, weil sie irreführen.
- f: Wie lange dauert der Innenausbau einer Wohnung?
  a: Je nach Größe und Umfang von wenigen Wochen bis mehrere Monate. Den Zeitplan erhalten Sie mit dem Angebot.
- f: Macht A-Bau auch Trockenbauarbeiten?
  a: 'Ja, Trockenbau gehört zu unserem Ausbauprogramm: Wände, Decken, Verkleidungen und abgehängte Decken.'
