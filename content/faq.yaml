  a: Hilfreich sind Grundrisse, Fotos, ggf. Gutachten und eine Beschreibung des Vorhabens mit gewünschtem Zeitrahmen.
- f: Wie lange ist ein Angebot gültig?
  a: Die Gültigkeit wird im Angebot ausgewiesen – üblich sind 4 bis 6 Wochen.
- f: Ist die Besichtigung kostenlos?
  a: Ja, die Erstberatung und Besichtigung ist unverbindlich. Erst mit dem Auftrag entstehen Kosten.
- f: Gibt es versteckte Kosten im Angebot?
  a: Nein. Sie erhalten feste Preise und klare Leistungen – ohne versteckte Kosten.
- f: Wie wird bezahlt?
  a: Die Zahlungsmodalitäten werden vertraglich vereinbart – im Baubereich üblich sind Abschlagszahlungen nach Baufortschritt gemäß Vertrag.
- f: Ist eine Anzahlung nötig?
  a: Das regelt der Werkvertrag. Üblich sind Abschlagszahlungen nach erbrachten Leistungen statt hoher Vorauszahlungen.
- f: Was passiert, wenn sich während des Baus etwas ändert?
  a: 'Änderungswünsche besprechen wir offen: Sie erhalten eine transparente Aufstellung der Mehr- oder Minderkosten, bevor wir fortfahren.'
- f: Bekomme ich eine Rechnung mit ausgewiesenen Leistungen?
  a: Ja, Sie erhalten eine ordnungsgemäße Rechnung mit ausgewiesenen Leistungen – wie gesetzlich vorgeschrieben.
- f: Kann ich den Auftrag stornieren?
  a: Vor Vertragsschluss jederzeit unverbindlich. Nach Auftragserteilung gelten die gesetzlichen Regelungen des Werkvertrags.
- f: Wie lange ist die gesetzliche Gewährleistung bei Bauleistungen?
  a: Für Bauleistungen gilt die gesetzliche Gewährleistungsfrist von 5 Jahren (§ 634a BGB) bei erheblichen Mängeln; im Vertrag können individuelle Regelungen vereinbart werden.
- f: Was ist bei Mängeln nach der Übergabe zu tun?
  a: Melden Sie den Mangel schriftlich mit Fotos. Wir prüfen, beheben und dokumentieren – innerhalb der Gewährleistungsfrist.
- f: Gibt A-Bau eine eigene Garantie?
