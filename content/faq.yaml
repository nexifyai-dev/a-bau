  a: Ja, wir verlegen Parkett, Laminat, Fliesen, Vinyl und Estrich – inklusive Trittschalldämmung und Abdichtung im Nassbereich.
- f: Übernimmt A-Bau auch Maler- und Lackierarbeiten?
  a: Ja, als Teil des Innenausbaus führen wir Maler- und Lackierarbeiten aus.
- f: Was bedeutet schlüsselfertig?
  a: 'Schlüsselfertig heißt: Sie erhalten das Gebäude bezugsfertig übergeben – vom Rohbau über Ausbau und Installationen bis zu Bodenbelägen und Türen. Sie können einziehen.'
- f: Baut A-Bau auch Einfamilienhäuser?
  a: Ja, wir realisieren schlüsselfertige Neubauten, darunter Einfamilien- und Mehrfamilienhäuser.
- f: Wer übernimmt die Koordination der Gewerke beim Schlüsselfertigbau?
  a: 'Wir: Als Generalunternehmer koordinieren wir alle Gewerke und geprüften Partner und übergeben termingerecht.'
